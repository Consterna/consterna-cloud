# ==============================================================================
# CONSTERNACLOUD - CONFIGURACIÓN FERRITECORE (Fabric 1.20.1 / 1.21+ - Oct 2026)
# Archivo: config/ferritecore.mixin.properties
# Fuente oficial: malte0811/FerriteCore (FerriteConfig.java)
# Nota: Reduce el consumo de RAM hasta en un 45% en modpacks medianos y grandes
# deduplicando BlockStates, modelos y propiedades en memoria.
# ==============================================================================

# Reemplaza la tabla de bloques vecinos por una estructura optimizada en RAM
replaceNeighborLookup=true

# Lee propiedades desde la tabla reemplazada en lugar de duplicarlas por estado
replacePropertyMap=true

# Cachea predicados de modelos multipart (requerido para multipartDeduplication)
cacheMultipartPredicates=true

# Evita instanciar nuevos Strings al crear ModelResourceLocations
modelResourceLocations=true

# Deduplica instancias de MultipartBakedModel compartidas entre estados
multipartDeduplication=true

# Deduplica datos cacheados de colisiones y formas en BlockStates
blockstateCacheDeduplication=true

# Deduplica geometría de vértices (BakedQuads) en modelos básicos
bakedQuadDeduplication=true

# Mantiene FastMap estándar (false = prioriza velocidad de CPU Ryzen 9 9950X)
compactFastMap=false

# No poblar la tabla vanilla redundante (ahorra RAM; cambiar a true solo si un mod antiguo crashea)
populateNeighborTable=false
