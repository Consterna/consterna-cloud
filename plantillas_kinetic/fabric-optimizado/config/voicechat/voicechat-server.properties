# ==============================================================================
# CONSTERNACLOUD - CONFIGURACIÓN SIMPLE VOICE CHAT (Fabric/Paper 1.21+)
# Archivo: config/voicechat/voicechat-server.properties
#
# ⚠️ PASO OBLIGATORIO EN KINETIC PANEL:
# 1. En Kinetic Panel ve a "Network" -> "Ports" (o usa "Quick Setup" si aplica).
# 2. Haz clic en "Open Port" para abrir un puerto adicional UDP.
# 3. Copia el número de puerto asignado (ej. 25614) y pégalo abajo en `port=`.
# ==============================================================================

# Puerto UDP del servidor de voz (Cambiar por el puerto adicional abierto en Kinetic Panel)
port=24454

# Dejar vacío para escuchar en la IP asignada al contenedor automáticamente
bind_address=

# Distancia máxima de escucha en bloques (48 bloques es el balance ideal para survival)
max_distance=48.0

# Multiplicador de distancia al susurrar (crouch/agacharse)
crouch_distance_multiplier=0.5

# Multiplicador de distancia al hablar en voz baja
whisper_distance_multiplier=0.5

# Codec de audio (VOIP optimiza la claridad de voz y minimiza el ancho de banda)
codec=VOIP

# Tamaño máximo de paquete UDP (1024 evita fragmentación en redes de LATAM)
mtu_size=1024

# Frecuencia de paquetes keep-alive en milisegundos
keep_alive=1000

# Permitir creación de grupos de voz dentro del servidor
enable_groups=true

# Host público opcional (dejar vacío salvo que se use proxy/dominio SRV separado)
voice_host=

# Permitir grabación de audio con mods de grabación
allow_recording=true

# Obligar a los jugadores a tener instalado Simple Voice Chat para entrar (false recomendado)
force_voice_chat=false

# Tiempo de espera de conexión de voz en milisegundos
login_timeout=10000

# Rango de transmisión de voz (-1 usa max_distance automáticamente)
broadcast_range=-1.0
