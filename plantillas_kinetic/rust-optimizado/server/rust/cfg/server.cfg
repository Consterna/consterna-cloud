// =============================================================================
// CONSTERNACLOUD - PLANTILLA OPTIMIZADA RUST DEDICATED SERVER (Octubre 2026)
// Archivo: server/rust/cfg/server.cfg
// Enfoque: Estabilidad de FPS/Tickrate en Ryzen 9 9950X y cero tirones de GC.
// =============================================================================

// 1. LÍMITE DE FPS Y TICKRATE DE SIMULACIÓN
// Por defecto Rust intenta correr a 256 FPS internos desperdiciando CPU.
// Limitar a 60 FPS mantiene el bucle de físicas al 100% de estabilidad.
fps.limit 60
server.tickrate 30

// 2. OPTIMIZACIÓN DE GARBAGE COLLECTOR (UNITY ENGINE)
// El buffer por defecto (256 MB) causa congelamientos ("GC Stutters") cada pocos
// minutos. Subirlo a 2048 MB elimina los tirones en servidores de 8GB a 12GB.
// (Nota: En el Plan 16 GB Dedicado puedes subirlo a `gc.buffer 4096`).
gc.buffer 2048

// 3. GUARDADO AUTOMÁTICO EN NVMe PCIe
// Guarda el mapa cada 300 segundos (5 minutos) para proteger el progreso.
server.saveinterval 300

// 4. RED, SEGURIDAD Y ANTICHEAT
server.encryption 2
server.secure true
chat.serverlog true

// 5. IA DE ANIMALES Y NPCs (Activa por defecto; pon false solo en servidores de Arena/PvP puro)
ai.think true
ai.move true
animal.sense 1

// 6. PARÁMETROS GENERALES DE JUEGO
server.pve false
server.stability true
server.radiation true
server.globalchat true
decay.upkeep true
decay.scale 1.0
