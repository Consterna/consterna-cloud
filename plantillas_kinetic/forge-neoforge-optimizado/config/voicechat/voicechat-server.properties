# ==============================================================================
# CONSTERNACLOUD - CONFIGURACIÓN SIMPLE VOICE CHAT (Forge 1.20.1 / NeoForge 1.21+)
# Archivo: config/voicechat/voicechat-server.properties
# Fuente oficial: henkelmax/simple-voice-chat (ServerConfig.java)
#
# ⚠️ PASO OBLIGATORIO EN KINETIC PANEL:
# 1. En Kinetic Panel ve a "Network" -> "Ports" (o usa "Quick Setup" si aplica).
# 2. Haz clic en "Open Port" para abrir un puerto adicional UDP.
# 3. Copia el número de puerto asignado (ej. 25618) y pégalo abajo en `port=`.
# ==============================================================================

# Puerto UDP del servidor de voz (Cambiar por el puerto adicional abierto en Kinetic Panel)
port=24454

# Dejar vacío para escuchar en la IP asignada al contenedor automáticamente
bind_address=

# Distancia máxima de escucha normal en bloques (48.0 es el estándar ideal para survival)
max_voice_distance=48.0

# Distancia máxima de escucha al susurrar en bloques
whisper_distance=24.0

# Codec de audio Opus (VOIP optimiza la claridad de voz y minimiza el ancho de banda)
codec=VOIP

# Tamaño máximo de paquete UDP en bytes (1024 evita fragmentación en rutas de red hacia LATAM)
mtu_size=1024

# Frecuencia de paquetes keep-alive en milisegundos
keep_alive=1000

# Permitir creación de grupos de voz dentro del servidor
enable_groups=true

# Host público opcional (dejar vacío salvo que se use proxy/dominio SRV separado)
voice_host=

# Permitir grabación de audio con addons o herramientas de grabación
allow_recording=true

# Permitir que espectadores hablen con jugadores vivos
spectator_interaction=false

# Permitir que espectadores hablen con el jugador que están espectando
spectator_player_possession=false

# Obligar a los jugadores a tener instalado Simple Voice Chat para entrar (false recomendado)
force_voice_chat=false

# Tiempo de espera de conexión de voz en milisegundos
login_timeout=10000

# Rango de transmisión de voz (-1.0 usa max_voice_distance automáticamente)
broadcast_range=-1.0

# Permitir que el servidor de voz responda a pings externos
allow_pings=true

# Cargar librerías nativas de Opus en el servidor dedicado
use_natives=true
