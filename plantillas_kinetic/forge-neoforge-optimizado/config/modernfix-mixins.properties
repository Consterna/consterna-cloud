# ==============================================================================
# CONSTERNACLOUD - CONFIGURACIÓN MODERNFIX (Forge 1.20.1 / NeoForge 1.21+)
# Archivo: config/modernfix-mixins.properties
# Fuente oficial: embeddedt/ModernFix
#
# Nota Técnica (Zero-Conflict):
# - Indispensable en modpacks de Forge y NeoForge (All The Mods, Create,
#   Prominence, RLCraft). `mixin.perf.dynamic_resources=true` ahorra 1.5 GB a
#   3 GB de RAM cargando modelos bajo demanda.
# - No se fuerzan otros mixins con `=true` ni mixins exclusivos de cliente
#   (`faster_item_rendering`) para respetar la detección automática de conflictos
#   de ModernFix junto a Canary, Lithium y FerriteCore.
# ==============================================================================

mixin.perf.dynamic_resources=true
