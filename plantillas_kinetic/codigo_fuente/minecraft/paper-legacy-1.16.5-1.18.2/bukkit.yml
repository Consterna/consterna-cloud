# ==============================================================================
# CONSTERNACLOUD - PLANTILLA PAPER LEGACY 1.16.5 / 1.17.1 / 1.18.2 (Octubre 2026)
# Archivo: bukkit.yml
# Enfoque: Cero Lag (TPS 20.0 estables) compatible con 1.16.5, 1.17.1 y 1.18.2.
# ==============================================================================

settings:
  allow-end: true
  warn-on-overload: true
  permissions-file: permissions.yml
  update-folder: update
  plugin-profiling: false
  connection-throttle: 4000
  query-plugins: true
  deprecated-verbose: default
  shutdown-message: "§b§lConsterna Cloud §8» §fReiniciando servidor por mantenimiento programado. ¡Volvemos en segundos!"
  minimum-api: none

spawn-limits:
  # Reducción inteligente (~20%) respecto a Vanilla para evitar saturación de MSPT.
  # Combinado con per-player-mob-spawns: true en paper.yml, las granjas rinden al 100%.
  monsters: 56
  animals: 8
  water-animals: 4
  water-ambient: 8
  ambient: 2

chunk-gc:
  period-in-ticks: 400

ticks-per:
  animal-spawns: 400
  monster-spawns: 2
  water-spawns: 20
  water-ambient-spawns: 40
  ambient-spawns: 40
  autosave: 6000

aliases: now-in-commands.yml
