# pause-when-empty-seconds:
# -1 (o 0) = DESACTIVADO (Recomendado en Paper: mantiene activas las granjas en spawn chunks,
#            chunk loaders, plugins con timers, mapas web BlueMap/Dynmap y tareas de Chunky).
# 60       = ACTIVADO (Úsalo solo en servidores casuales de amigos sin granjas 24/7 ni Chunky pendiente,
#            o con mods de estaciones/días donde no quieran que pase el tiempo desconectados).
