# ==============================================================================
# CONSTERNACLOUD - CONFIGURACIÓN SIMPLE VOICE CHAT (Purpur 1.20.1 / 1.21+)
# Archivo en Plugins (Purpur): plugins/voicechat/voicechat-server.properties
