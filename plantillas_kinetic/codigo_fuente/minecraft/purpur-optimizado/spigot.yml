config-version: 12

settings:
  debug: false
  bungeecord: false
  sample-count: 12
  player-shuffle: 0
  user-cache-size: 1000
  save-user-cache-on-stop-only: false
  moved-wrongly-threshold: 0.0625
  moved-too-quickly-multiplier: 10.0
  timeout-time: 60
  restart-on-crash: true
  restart-script: ./start.sh
  netty-threads: 4
  attribute:
    maxHealth:
      max: 2048.0
    movementSpeed:
      max: 2048.0
    attackDamage:
      max: 2048.0
  log-villager-deaths: true
  log-named-deaths: true

messages:
  whitelist: "§b§lConsterna Cloud §8» §cNo estás en la Whitelist de este servidor."
  unknown-command: "§cComando desconocido. Usa /help para ver la lista."
  server-full: "§c¡El servidor está lleno en este momento!"
  outdated-client: "§cCliente desactualizado. Por favor usa la versión {0}"
  outdated-server: "§cServidor en otra versión. Por favor usa {0}"
  restart: "§b§lConsterna Cloud §8» §fEl servidor se está reiniciando..."

advancements:
  disable-saving: false
  disabled:
    - minecraft:story/disabled

commands:
  tab-complete: 0
  send-namespaced: true
  log: true
  spam-exclusions:
    - /skill
  silent-commandblock-console: false
  replace-commands:
    - setblock
    - summon
    - testforblock
    - tellraw

players:
  disable-saving: false

