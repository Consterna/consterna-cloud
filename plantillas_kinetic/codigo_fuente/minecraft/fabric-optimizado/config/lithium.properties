# ==============================================================================
# CONSTERNACLOUD - CONFIGURACIÓN LITHIUM (Fabric 1.20.1 / 1.21+ - Octubre 2026)
# Archivo: config/lithium.properties
# Fuente oficial: CaffeineMC/lithium (lithium-mixin-config.md)
#
# Nota Técnica (Especificación Oficial CaffeineMC):
# - En Lithium, un archivo `lithium.properties` sin reglas forzadas mantiene
#   ACTIVAS al 100% todas las optimizaciones estables de físicas, IA de mobs,
#   explosiones, BlockEntities y chunks tanto en 1.20.1 como en 1.21.x.
# - Además, al no forzar líneas `mixin.*=true` manuales, permitimos que mods
#   acompañantes como Krypton, ServerCore o C2ME apliquen automáticamente sus
#   reglas de compatibilidad (`lithium:options`) y evitamos warnings de claves
#   renombradas entre 1.20.1 y 1.21.1+ (como `mixin.world.player_chunk_tick`).
# - Si algún mod específico requiere desactivar una regla, añádela abajo con
#   `=false` (ejemplo: `mixin.ai.poi=false`).
# ==============================================================================
