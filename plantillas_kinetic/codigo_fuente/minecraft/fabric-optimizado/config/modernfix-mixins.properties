# ==============================================================================
# CONSTERNACLOUD - CONFIGURACIÓN MODERNFIX (Fabric 1.20.1 / 1.21+ - Octubre 2026)
# Archivo: config/modernfix-mixins.properties
# Fuente oficial: embeddedt/ModernFix
#
# Nota Técnica (Zero-Conflict):
# - ModernFix ya activa por defecto todas sus optimizaciones seguras de servidor
#   (deduplicate_location, compact_bit_storage, chunk_deadlock, paper_chunk_patches)
#   y desactiva automáticamente las que entren en conflicto con Lithium/C2ME.
# - Aquí SOLO declaramos `mixin.perf.dynamic_resources=true` (que viene apagado
#   por defecto) para liberar entre un 35% y 50% de memoria RAM y acelerar el
#   arranque sin forzar overrides (`Force-enabling`) ni incluir mixins de cliente.
# ==============================================================================

mixin.perf.dynamic_resources=true
