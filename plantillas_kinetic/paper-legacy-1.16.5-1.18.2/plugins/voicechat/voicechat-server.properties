# ==============================================================================
# CONSTERNACLOUD - CONFIGURACIÓN SIMPLE VOICE CHAT (Paper Legacy 1.16.5 - 1.18.2)
# Archivo en Plugins (Paper): plugins/voicechat/voicechat-server.properties
# Fuente oficial: henkelmax/simple-voice-chat (ServerConfig.java)
#
# ⚠️ PASO OBLIGATORIO EN KINETIC PANEL (Si el cliente usa Simple Voice Chat):
# 1. En Kinetic Panel ve a "Network" -> "Ports" (o usa "Quick Setup").
# 2. Haz clic en "Open Port" para abrir un puerto adicional UDP.
# 3. Copia el número de puerto asignado (ej. 25618) y pégalo abajo en `port=`.
# ==============================================================================

port=24454
bind_address=
max_voice_distance=48.0
whisper_distance=24.0
codec=VOIP
mtu_size=1024
keep_alive=1000
enable_groups=true
voice_host=
allow_recording=true
spectator_interaction=false
spectator_player_possession=false
force_voice_chat=false
login_timeout=10000
broadcast_range=-1.0
allow_pings=true
use_natives=true
